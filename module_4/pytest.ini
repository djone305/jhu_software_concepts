[pytest]
addopts = -q --cov=src --cov-report=term-missing --cov-fail-under=100
markers =
    analysis: tests for analysis formatting
    buttons: tests for UI buttons
    clean: tests for data cleaning logic
    db: database related tests
    integration: end-to-end integration tests
    load_data: tests for loading data into the database
    orm: SQLAlchemy ORM tests
    query: tests for database queries
    scrape: tests for the web scraper
    web: tests for flask web routes