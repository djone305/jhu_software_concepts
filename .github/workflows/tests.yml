name: Run Pytest Suite with PostgreSQL

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: gradcafe_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f module_4/requirements.txt ]; then pip install -r module_4/requirements.txt; fi
          pip install pytest pytest-cov python-dotenv

      - name: Create Dummy .env File for CI
        run: |
          echo "DB_USER=postgres" > module_4/src/.env
          echo "DB_PASSWORD=postgrespassword" >> module_4/src/.env
          echo "DB_HOST=localhost" >> module_4/src/.env
          echo "DB_PORT=5432" >> module_4/src/.env
          echo "DB_NAME=gradcafe_db" >> module_4/src/.env
          echo "SECRET_KEY=ci-test-key" >> module_4/src/.env

      - name: Run Pytest Suite
        env:
          DB_USER: postgres
          DB_PASSWORD: postgrespassword
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gradcafe_db
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/gradcafe_db
          SECRET_KEY: ci-test-key
        run: |
          cd module_4
          pytest -v --cov=src